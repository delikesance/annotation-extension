<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Web Annotator</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="update-banner" id="update-banner" hidden>
    <span id="update-text">Mise à jour disponible</span>
    <button class="btn btn-small" id="btn-update" type="button">Télécharger</button>
  </div>

  <main class="rail" id="rail">
    <header class="rail-header">
      <div class="rail-title-row">
        <div class="status" id="status">
          <span class="dot"></span>
          <span id="status-text">Inactif</span>
        </div>
        <button class="icon-btn" id="btn-close" type="button" aria-label="Quitter l'annotateur" title="Quitter l'annotateur">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="counter" id="counter">Cliquez sur l'icône de l'extension pour démarrer.</div>
    </header>

    <div class="status-line" id="status-line" role="status" hidden></div>

    <section class="view" id="view-list">
      <div class="add-row">
        <button class="btn btn-accent btn-add" id="btn-annotate" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span id="btn-annotate-text">Ajouter une annotation</span>
          <span class="kbd">A</span>
        </button>
      </div>
      <div class="list" id="list" aria-label="Annotations"></div>
      <details class="hosting" id="hosting">
        <summary>Hébergement des images <span id="hosting-state" class="hosting-state"></span></summary>
        <form class="hosting-body" id="hosting-form" autocomplete="off">
          <p class="hosting-help">Les captures sont envoyées vers votre bucket S3 (MinIO, Garage, R2…) sous une adresse non devinable, puis les liens sont ajoutés au prompt, à l'issue GitHub et au JSON.</p>
          <label class="eyebrow" for="h-endpoint">Endpoint S3</label>
          <input class="field h-input" id="h-endpoint" type="url" placeholder="https://s3.exemple.cloud (MinIO, Garage, R2…)">
          <label class="eyebrow" for="h-region">Région</label>
          <input class="field h-input" id="h-region" type="text" value="us-east-1" placeholder="us-east-1 (MinIO) · garage (Garage) · auto (R2)">
          <label class="eyebrow" for="h-bucket">Bucket</label>
          <input class="field h-input" id="h-bucket" type="text" placeholder="annotations">
          <label class="eyebrow" for="h-key">Access key ID</label>
          <input class="field h-input" id="h-key" type="text">
          <label class="eyebrow" for="h-secret">Secret access key</label>
          <input class="field h-input" id="h-secret" type="password" placeholder="Enregistré (masqué)">
          <label class="eyebrow" for="h-public">URL publique (domaine du CDN)</label>
          <input class="field h-input" id="h-public" type="url" placeholder="https://img.exemple.com">
          <label class="eyebrow" for="h-days">Expiration des liens (jours)</label>
          <input class="field h-input" id="h-days" type="number" min="1" max="365" value="7">
          <div class="hosting-actions">
            <button class="btn btn-small btn-ghost-danger" id="h-clear" type="button">Désactiver</button>
            <button class="btn btn-small btn-accent" id="h-save" type="submit">Enregistrer et tester</button>
          </div>
          <div class="hosting-result" id="h-result" role="status" hidden></div>
        </form>
      </details>
      <footer class="rail-footer">
        <button class="btn btn-primary" id="btn-export" type="button">
          <span>Exporter la session</span><span class="kbd">Ctrl E</span>
        </button>
        <button class="btn" id="btn-next" type="button">
          <span>Nouvel écran</span><span class="kbd">N</span>
        </button>
      </footer>
    </section>

    <section class="view" id="view-export" hidden>
      <div class="export-head">
        <button class="btn btn-small" id="btn-back" type="button">← Retour</button>
        <div class="export-title">
          <h1>Exporter la session</h1>
          <span id="export-badge" class="export-badge"></span>
        </div>
      </div>
      <div class="hosting-line" id="hosting-line" role="status" hidden></div>
      <div class="export-body" id="export-body"></div>
      <footer class="rail-footer" id="export-footer"></footer>
    </section>
  </main>
  <script src="insights.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
